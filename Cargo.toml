[package]
name = "rust-api-server"
description = "A simple Rust API server using Prisma, Docker, and Postgresql"
version = "0.1.0"
authors = ["Your Name <your@email.com>"]
edition = "2018"

[dependencies]
actix-web = "4.2.1"
actix-codec = "0.5.0"
actix-service = "0.4.0"
actix-rt = "2.7.0"
actix-utils = "4.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prisma-client-rust = { version = "0.7.0", features = ["postgres"] }
env_logger = "0.9.1"
diesel = { version = "1.4.8", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
pretty-env-logger = "0.4.0"
